# =================================================================
# PERFIL DE DESARROLLO (dev)
# =================================================================
# Se activa con SPRING_PROFILES_ACTIVE=dev (ya lo hacen docker compose y ./gradlew bootRun).
# NUNCA en produccion: borra la base de datos.

# Al arrancar la API se borra la base de datos y se cargan 01_schema, 02_procedures,
# 03_seeds y 04_demo_data. Si cambia alguno de esos scripts, se repite.
# Pon false para conservar los datos entre arranques.
app.dev.reset-db=true
# Carpeta de los scripts, relativa a la carpeta desde la que se arranca la API
app.dev.db-scripts-dir=database
# Cada cuanto se comprueba si han cambiado los scripts (milisegundos)
app.dev.db-watch-ms=3000
