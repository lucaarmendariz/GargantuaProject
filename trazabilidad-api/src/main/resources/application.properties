spring.application.name=trazabilidad-api
# Secretos locales: copia database/.env.example a database/.env
spring.config.import=optional:file:database/.env[.properties]
# Puerto en el que correrá tu servidor backend (por defecto es 8080)
server.port=8080

# =================================================================
# CONFIGURACIÓN DE LA BASE DE DATOS (MARIADB)
# =================================================================
# OJO: Cambia "3306" por el puerto que te funcionó en el paso anterior (3306, 3307, etc.)
spring.datasource.url=jdbc:mariadb://localhost:3307/traceability_lean
spring.datasource.username=trazabilidad_app
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# =================================================================
# SEGURIDAD
# =================================================================
# Clave para firmar los JWT (minimo 32 caracteres)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-hours=8
# Origenes del navegador autorizados, separados por comas
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
